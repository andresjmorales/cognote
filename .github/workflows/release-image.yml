name: Release image

# Builds the CogNote app image and publishes it to GitHub Container Registry
# (ghcr.io/andresjmorales/cognote) when a version tag is pushed:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Tags published for v1.2.0: 1.2.0, 1.2 and latest (pre-releases such as
# v1.3.0-rc.1 get only their own tag). The image holds no Supabase values —
# they are read at runtime — so one image serves every self-hoster.
#
# Auth is the workflow's own GITHUB_TOKEN; no secrets to configure. The first
# publish creates the package as PRIVATE: make it public once under the
# package's settings (github.com/users/andresjmorales/packages/container/cognote/settings).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Manual runs (workflow_dispatch) publish a commit-pinned sha-… tag only,
      # never "latest".
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=CogNote
            org.opencontainers.image.licenses=MIT

      # arm64 covers Raspberry Pi and other ARM home servers.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
