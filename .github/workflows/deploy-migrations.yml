name: Deploy Database Migrations

# Pushes new Supabase migrations to the production database whenever a change
# to supabase/migrations/ lands on main (e.g. via a merged PR).
#
# Like Liquibase, `supabase db push` is incremental: Supabase records applied
# migrations in the remote `supabase_migrations.schema_migrations` table and
# only runs files from supabase/migrations/ that aren't recorded yet, in
# timestamp order.
#
# Uses --db-url (not `supabase link`) so CI does not depend on the Management
# API api-keys schema that broke `link` in CLI v2.112.0
# (https://github.com/supabase/cli/issues/6115).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN     Personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_ID       Project ref (Dashboard → Project Settings → General)
#   SUPABASE_DB_PASSWORD      Database password (Dashboard → Project Settings → Database)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        run: |
          ENCODED_PW=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")
          supabase db push --yes \
            --db-url "postgresql://postgres:${ENCODED_PW}@db.${SUPABASE_PROJECT_ID}.supabase.co:5432/postgres"

      # Post-merge migrate is not a PR check — surface failures as an issue so
      # a green PR cannot silently leave prod schema behind.
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Migration deploy failed on ${context.sha.slice(0, 7)}`;
            const body = [
              `**Deploy Database Migrations** failed on \`${context.ref}\` (\`${context.sha}\`).`,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Prod may be missing schema from the latest migration(s). Fix and re-run the workflow (or `supabase db push`), then close this issue.",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
